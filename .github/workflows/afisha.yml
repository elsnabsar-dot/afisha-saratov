name: Saratov Afisha
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Digest: today / three / week / all (preview only)'
        type: choice
        options: [all, today, three, week]
        default: all
      publish:
        description: 'Send to Telegram (choose one digest, not all)'
        type: boolean
        default: false
  schedule:
    - cron: '17 4 * * *'
    - cron: '17 14 * * *'
    - cron: '17 15 * * 0'
permissions:
  contents: write
concurrency:
  group: afisha-publications
  cancel-in-progress: false
jobs:
  digest:
    if: github.event_name == 'workflow_dispatch' || vars.AFISHA_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install 'requests==2.32.5' 'beautifulsoup4==4.14.2'
      - name: Build preview or publish
        env:
          EVENT_NAME: ${{ github.event_name }}
          SCHEDULE: ${{ github.event.schedule }}
          INPUT_MODE: ${{ inputs.mode }}
          INPUT_PUBLISH: ${{ inputs.publish }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "schedule" ]]; then
            case "$SCHEDULE" in
              '17 4 * * *') mode=today ;;
              '17 14 * * *') mode=three ;;
              '17 15 * * 0') mode=week ;;
              *) exit 1 ;;
            esac
            python afisha.py --mode "$mode" --publish
          elif [[ "$INPUT_PUBLISH" == "true" ]]; then
            python afisha.py --mode "$INPUT_MODE" --publish
          else
            python afisha.py --mode "${INPUT_MODE:-all}"
          fi
      - name: Preserve publication state even on Telegram failure
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f state/publication.json ]]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state/publication.json
            if ! git diff --cached --quiet; then
              git commit -m 'Save afisha publication state'
              git pull --rebase origin main
              git push origin HEAD:main
            fi
          fi
      - name: Upload preview and source report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: afisha-preview
          path: preview/
          retention-days: 3
